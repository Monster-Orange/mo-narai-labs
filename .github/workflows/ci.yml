name: ci
on:
  workflow_dispatch: # by hand only: make preflight is the gate (the Actions cost cut)
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm preflight
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
